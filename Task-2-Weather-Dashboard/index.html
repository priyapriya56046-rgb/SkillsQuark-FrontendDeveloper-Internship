
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="weather-app">
    <h1>☁️ Weather Dashboard</h1>
    <p>Check the weather in your city</p>

    <form id="weather-form">
      <input
        type="text"
        id="city-input"
        placeholder="Enter city name"
        aria-label="City name"
        required
      >
      <button type="submit">Search</button>
    </form>

    <p id="message">Enter a city to check its weather.</p>

    <section id="weather-result" hidden>
      <h2 id="city-name"></h2>
      <div id="weather-icon">🌤️</div>
      <p id="description"></p>
      <p class="temperature"><span id="temperature"></span>°C</p>

      <div class="details">
        <p>💧 Humidity: <span id="humidity"></span>%</p>
        <p>💨 Wind: <span id="wind"></span> km/h</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
